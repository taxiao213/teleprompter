name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # release job 需要创建 GitHub Release

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 一个 macOS job 出双架构 dmg（electron-builder 内置交叉打包，本地已验证）
          - os: macos-14
            label: macOS
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # electron-vite 5 构建进度条在非 TTY stdout 上崩溃（clearLine/moveCursor），
      # 注入 no-op polyfill；三个平台通用
      NODE_OPTIONS: --require ./scripts/tty-polyfill.cjs
      # CI 不做 macOS 签名（无证书 secrets），发布未签名包
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 产物命名：teleprompter-<tag>-<平台>.<格式>（tag v0.1.0 → teleprompter-v0.1.0-macOS-arm64.dmg；
      # main 分支构建时 ref_name=main，产物为 teleprompter-main-* 仅作 CI 验证）
      - name: Stage release assets (macOS, arm64 + x64)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          mv dist/Teleprompter-*-arm64.dmg "release-assets/teleprompter-${{ github.ref_name }}-macOS-arm64.dmg"
          mv dist/Teleprompter-*-x64.dmg "release-assets/teleprompter-${{ github.ref_name }}-macOS-x86_64.dmg"
      - name: Stage release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Move-Item dist/Teleprompter-*-x64.exe "release-assets/teleprompter-${{ github.ref_name }}-windows-x64-setup.exe"
      - name: Stage release assets (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          mv dist/Teleprompter-*.AppImage "release-assets/teleprompter-${{ github.ref_name }}-linux-x64.AppImage"
          mv dist/Teleprompter-*.tar.gz "release-assets/teleprompter-${{ github.ref_name }}-linux-x64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: teleprompter-${{ github.ref_name }}-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # release 正文读 docs/release-notes/<tag>.md
      - uses: actions/download-artifact@v4
        with:
          pattern: teleprompter-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
