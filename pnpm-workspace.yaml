onlyBuiltDependencies:
  - electron
  - esbuild
  - electron-winstaller

# app-builder-lib 26.15.3 reads ElectronDownloadCacheMode from @electron/get,
# which only exists in >= 3.1 — pin it past the too-permissive ^3.0.0 range.
overrides:
  'app-builder-lib>@electron/get': '^3.1.0'

# Install sherpa-onnx native binaries for all target platforms, not just the
# host — required for cross-building Windows packages from macOS (and CI).
supportedArchitectures:
  os:
    - darwin
    - win32
  cpu:
    - arm64
    - x64
