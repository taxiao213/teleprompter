# pnpm 11 构建脚本审批：三个包都有 postinstall（electron 下载二进制、
# esbuild 安装平台二进制、electron-winstaller），CI 全新安装必须放行，
# 否则 pnpm 11 直接 ERR_PNPM_IGNORED_BUILDS 失败。
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true

# pnpm 10 及以下的等效配置（保留以兼容旧版 pnpm）
onlyBuiltDependencies:
  - electron
  - esbuild
  - electron-winstaller

# app-builder-lib 26.15.3 reads ElectronDownloadCacheMode from @electron/get,
# which only exists in >= 3.1 — pin it past the too-permissive ^3.0.0 range.
overrides:
  'app-builder-lib>@electron/get': '^3.1.0'

# Install sherpa-onnx native binaries for all target platforms, not just the
# host — required for cross-building Windows packages from macOS (and CI).
supportedArchitectures:
  os:
    - darwin
    - win32
    - linux
  cpu:
    - arm64
    - x64
